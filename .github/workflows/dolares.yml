name: Scraper Dolares

permissions:
  contents: write
  id-token: write

on:
  schedule:
    # cada 20 min, 12:00-21:00 UTC (~09:00-18:00 AR), lunes a viernes
    - cron: "*/20 12-21 * * 1-5"
  workflow_dispatch:

jobs:
  dolares:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Run scraper Dolares
        env:
          S3_DATA_BUCKET: argly-data
          S3_DATA_REGION: us-east-1
        run: |
          python scrapers/scraper_dolares.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/dolares
          git commit -m "chore: update dolares" || echo "No changes"
          git pull --rebase origin main
          git push
