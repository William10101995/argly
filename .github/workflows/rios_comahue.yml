name: Scraper Rios Comahue

permissions:
  contents: write

on:
  schedule:
    - cron: "0 13 * * *" # ~10:00 AR, la AIC publica medios diarios una vez al día
  workflow_dispatch:

jobs:
  rios-comahue:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper Rios Comahue
        run: |
          python scrapers/scraper_rios_aic.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/rios_comahue
          git commit -m "chore: update rios comahue (AIC)" || echo "No changes"
          git pull --rebase origin main
          git push
